    <script>
      // Browser extension error shield (MetaMask, Web3 injected scripts, ad-blockers)
      (function() {
        function isExtensionError(source, message) {
          var str = (source || '') + ' ' + (message || '');
          return /chrome-extension:|moz-extension:|safari-extension:|metamask|inpage\.js/i.test(str);
        }
        window.addEventListener('error', function(e) {
          if (isExtensionError(e.filename, e.message) || isExtensionError('', e.error && e.error.stack)) {
            e.stopImmediatePropagation();
            e.preventDefault();
            return true;
          }
        }, true);
        window.addEventListener('unhandledrejection', function(e) {
          var reason = e.reason;
          var msg = (reason && (reason.message || reason.stack || String(reason))) || '';
          if (isExtensionError('', msg)) {
            e.stopImmediatePropagation();
            e.preventDefault();
            return true;
          }
        }, true);
      })();
    </script>
